<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thi Lý Thuyết Hô Hấp | Khải Văn</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#17324d;--muted:#64748b;--line:#dbe5ef;--accent:#0f766e;--accent2:#0b5f59;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--soft:#edf7f6}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#0f172a}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{max-width:1180px;margin:auto;padding:22px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:20px;margin:0;color:var(--ink)}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.timer{font-variant-numeric:tabular-nums;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:800;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.start{max-width:760px;margin:50px auto;padding:30px}.start h2{margin-top:0;color:var(--ink)}.exam-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.exam-btn{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}.exam-btn.active{border-color:var(--accent);background:var(--soft)}.exam-btn b{display:block;color:var(--ink);font-size:17px}.exam-btn span{color:var(--muted);font-size:13px}.settings{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:18px 0}.settings input[type=number]{width:90px;padding:9px;border:1px solid var(--line);border-radius:10px}.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:800}.primary:hover{background:var(--accent2)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.question-card{padding:26px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.question{font-size:20px;line-height:1.5;color:var(--ink);font-weight:750;margin:14px 0 20px}.options{display:grid;gap:11px}.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;transition:.15s}.opt:hover{border-color:#94a3b8}.opt.selected{border-color:var(--accent);background:var(--soft)}.opt.correct{border-color:#86efac;background:#f0fdf4}.opt.wrong{border-color:#fecaca;background:#fef2f2}.badge{min-width:28px;height:28px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;font-weight:800}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 15px;font-weight:700}.ghost:disabled{opacity:.45;cursor:not-allowed}
.side{padding:18px;position:sticky;top:18px;height:max-content}.side h3{margin:0 0 12px;color:var(--ink)}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent);width:0}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:8px 0 15px}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qnav{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:700}.qnav.answered{background:#dff4f1;border-color:#8fd2cb}.qnav.current{outline:2px solid var(--accent)}.qnav.review{box-shadow:inset 0 -4px 0 #f59e0b}.submit{width:100%;margin-top:16px;background:#0f172a;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800}
.result{max-width:820px;margin:35px auto;padding:28px}.score{font-size:48px;font-weight:900;color:var(--accent);margin:6px 0}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.metric{padding:14px;border:1px solid var(--line);border-radius:12px}.metric b{font-size:22px;display:block}.review-list{display:grid;gap:12px;margin-top:18px}.review-item{padding:16px;border:1px solid var(--line);border-radius:12px}.review-item.ok{border-left:5px solid var(--ok)}.review-item.bad{border-left:5px solid var(--bad)}.review-item p{margin:6px 0}.small{font-size:13px;color:var(--muted)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.qgrid{grid-template-columns:repeat(8,1fr)}}@media(max-width:560px){.shell{padding:12px}.exam-grid,.result-grid{grid-template-columns:1fr}.qgrid{grid-template-columns:repeat(5,1fr)}.question-card{padding:18px}.topbar{align-items:flex-start}.brand p{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="logo">KV</div><div><h1>Thi Lý Thuyết Hô Hấp</h1><p>CKI Nội CT · Cao học · BSNT · Bộ đề 2025–2028</p></div></div>
    <div id="timer" class="timer hidden">40:00</div>
  </header>

  <section id="start" class="card start">
    <h2>Chọn đề thi</h2>
    <p class="small">Mỗi đề gồm 40 câu trắc nghiệm. Đáp án được giữ nguyên theo tài liệu gốc đã cung cấp.</p>
    <div class="exam-grid">
      <button class="exam-btn active" data-exam="0"><b>Đề 1</b><span>40 câu · Hô hấp</span></button>
      <button class="exam-btn" data-exam="1"><b>Đề 2</b><span>40 câu · Hô hấp</span></button>
    </div>
    <div class="settings">
      <label>Thời gian: <input id="minutes" type="number" min="5" max="180" value="40"> phút</label>
      <label><input id="shuffle" type="checkbox"> Trộn thứ tự câu hỏi</label>
    </div>
    <button id="startBtn" class="primary">Bắt đầu làm bài</button>
  </section>

  <section id="quiz" class="layout hidden">
    <main class="card question-card">
      <div class="meta"><span id="examName"></span><button id="markBtn" class="ghost" style="padding:6px 10px">☆ Đánh dấu</button></div>
      <div id="question" class="question"></div>
      <div id="options" class="options"></div>
      <div class="controls"><button id="prev" class="ghost">← Câu trước</button><button id="next" class="primary">Câu tiếp →</button></div>
    </main>
    <aside class="card side">
      <h3>Tiến độ</h3><div class="progress"><div id="bar"></div></div><div class="stats"><span id="answeredTxt">0/40 đã làm</span><span id="pctTxt">0%</span></div>
      <div id="qgrid" class="qgrid"></div><button id="submit" class="submit">Nộp bài</button>
    </aside>
  </section>

  <section id="result" class="card result hidden">
    <div class="small" id="resultExam"></div><h2>Kết quả bài thi</h2><div id="score" class="score">0/40</div><div id="grade"></div>
    <div class="result-grid"><div class="metric"><b id="correctN">0</b><span class="small">Câu đúng</span></div><div class="metric"><b id="wrongN">0</b><span class="small">Câu sai / bỏ trống</span></div><div class="metric"><b id="timeUsed">0:00</b><span class="small">Thời gian làm</span></div></div>
    <button id="retry" class="primary">Làm lại đề</button><button id="home" class="ghost">Chọn đề khác</button>
    <div id="review" class="review-list"></div>
  </section>
</div>
<script>
const BANK=[[{"number": 1, "question": "Phát biểu đúng về enzyme ức chế proteinase trong cơ chế bệnh sinh của bệnh phổi tắc nghẽn mạn tính:", "options": [{"label": "A", "text": "Giải phóng từ bạch cầu đa nhân"}, {"label": "B", "text": "Giải phóng từ đại thực bào"}, {"label": "C", "text": "Tác dụng giáng hoá protein của tổ chức gian bào"}, {"label": "D", "text": "Có tác dụng bảo vệ đường hô hấp"}], "answer": "D"}, {"number": 2, "question": "Hậu quả của việc giảm oxy và tăng CO2 máu trong bệnh phổi tắc nghẽn mạn tính là do, NGOẠI TRỪ:", "options": [{"label": "A", "text": "Tắc nghẽn đường hô hấp dưới"}, {"label": "B", "text": "Phá huỷ cấu trúc nhu mô phổi"}, {"label": "C", "text": "Bất thường cấu trúc mạch máu phổi"}, {"label": "D", "text": "Giảm kích thích trung tâm hô hấp"}], "answer": "D"}, {"number": 3, "question": "Tình trạng tăng áp động mạch phổi ở bệnh phổi tắc nghẽn mạn tính xuất hiện khi giảm oxy máu:", "options": [{"label": "A", "text": "< 80mmHg"}, {"label": "B", "text": "< 60mmHg"}, {"label": "C", "text": "< 55mmHg"}, {"label": "D", "text": "< 50mmHg"}], "answer": "B"}, {"number": 4, "question": "Bệnh nhân bệnh phổi tắc nghẽn mạn tính, kết quả hô hấp ký sau test hồi phục phế quản FEV1/FVC = 0,62 và FEV1 84%. Hãy kết luận giai đoạn bệnh:", "options": [{"label": "A", "text": "GOLD 1"}, {"label": "B", "text": "GOLD 2"}, {"label": "C", "text": "GOLD 3"}, {"label": "D", "text": "GOLD 4"}], "answer": "A"}, {"number": 5, "question": "Liệu pháp thuốc nào có vai trò chính trong kiểm soát triệu chứng COPD giai đoạn ổn định?", "options": [{"label": "A", "text": "Thuốc giảm đau."}, {"label": "B", "text": "Thuốc giãn phế quản."}, {"label": "C", "text": "Thuốc tăng huyết áp."}, {"label": "D", "text": "Thuốc chống trầm cảm."}], "answer": "B"}, {"number": 6, "question": "Chọn lựa kháng sinh đầu tiên điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính mức độ nhẹ:", "options": [{"label": "A", "text": "Betalactam"}, {"label": "B", "text": "Betalactam/kháng betalactamase"}, {"label": "C", "text": "Fluoroquinolon"}, {"label": "D", "text": "Phối hợp fluoroquinolon + Cephalosporin"}], "answer": "A"}, {"number": 7, "question": "Chỉ định tiêm ngừa nào là ưu tiên cho bệnh nhân COPD?", "options": [{"label": "A", "text": "Vắc xin viêm gan."}, {"label": "B", "text": "Vắc xin thủy đậu."}, {"label": "C", "text": "Vắc xin cúm."}, {"label": "D", "text": "Vắc xin sốt rét."}], "answer": "C"}, {"number": 8, "question": "Tiêu chuẩn ngưng theo dõi điều trị đợt cấp bệnh phổi tắc nghẽn mạn tính nội trú, NGOẠI TRỪ:", "options": [{"label": "A", "text": "Nhu cầu sử dụng beta 2 hít <6 lần/ngày"}, {"label": "B", "text": "Có thể trở lại các sinh hoạt như trước đợt cấp"}, {"label": "C", "text": "Lâm sàng ổn định trong 24h"}, {"label": "D", "text": "Khí máu động mạch trở về bình thường"}], "answer": "D"}, {"number": 9, "question": "Dựa vào pK/pD, người ta chia kháng sinh thành bao nhiêu nhóm:", "options": [{"label": "A", "text": "1 nhóm"}, {"label": "B", "text": "2 nhóm"}, {"label": "C", "text": "3 nhóm"}, {"label": "D", "text": "4 nhóm"}], "answer": "C"}, {"number": 10, "question": "Thuật ngữ Viêm phổi cộng đồng, Viêm phổi bệnh viện, Viêm phổi liên quan tới chăm sóc y tế, Viêm phổi thở máy là để:", "options": [{"label": "A", "text": "Chỉ tình trạng nặng hay nhẹ của viêm phổi"}, {"label": "B", "text": "Chỉ điều kiện y tế cần chăm sóc đặc biệt"}, {"label": "C", "text": "Để định hướng tác nhân vi sinh gây bệnh"}, {"label": "D", "text": "Để phân loại bệnh học viêm phổi"}], "answer": "C"}, {"number": 11, "question": "Các yếu tố nguy cơ nhiễm P.aeruginosa đề kháng kháng sinh ở bệnh nhân viêm phổi cộng đồng bao gồm:", "options": [{"label": "A", "text": "Tiền sử đã nhiễm tụ cầu kháng Methicilline"}, {"label": "B", "text": "Tiền sử đã nhiễm phế cầu kháng Penicilline"}, {"label": "C", "text": "Nhiễm trùng da tái diễn"}, {"label": "D", "text": "Có bệnh cấu trúc phổi"}], "answer": "D"}, {"number": 12, "question": "Tác nhân vi sinh không điển hình trong bệnh viêm phổi. CHỌN CÂU SAI:", "options": [{"label": "A", "text": "Mycoplasma pneumoniae"}, {"label": "B", "text": "Chlamydia pneumoniae"}, {"label": "C", "text": "Haemophilus influenzae"}, {"label": "D", "text": "Legionella pneumophila"}], "answer": "C"}, {"number": 13, "question": "Chọn đáp án đúng: “ Viêm phổi là tình trạng ..(1).. của ..(2).. bao gồm viêm phế nang, ống và túi phế nang, tiểu phế quản tận hoặc viêm tổ chức kẽ của phổi.", "options": [{"label": "A", "text": "(1) viêm, (2) cấu trúc phổi"}, {"label": "B", "text": "(1) nhiễm trùng, (2) cấu trúc phổi"}, {"label": "C", "text": "(1) viêm, (2) nhu mô phổi"}, {"label": "D", "text": "(1) nhiễm trùng, (2) nhu mô phổi"}], "answer": "D"}, {"number": 14, "question": "Chọn 1 Câu đúng trong những Câu trả lời sau đây: Thuật ngữ điều trị kháng sinh kinh nghiệm dùng để chỉ:", "options": [{"label": "A", "text": "Điều trị kháng sinh theo kinh nghiệm của thầy thuốc lâm sàng"}, {"label": "B", "text": "Điều trị kháng sinh theo khuyến cáo dựa trên bằng chứng y học"}, {"label": "C", "text": "Điều trị kháng sinh không dựa trên xét nghiệm vi sinh"}, {"label": "D", "text": "Điều trị kháng sinh dựa trên vi khuẩn gây bệnh phổ biến tại địa phương"}], "answer": "C"}, {"number": 15, "question": "Theo Bộ Y Tế Việt Nam 2026, liều Ertapenem được khuyến cáo sử dụng trong điều trị viêm phổi cộng đồng là:", "options": [{"label": "A", "text": "2g TMC/8h"}, {"label": "B", "text": "1g TTM/ngày"}, {"label": "C", "text": "400mg TTM/8h"}, {"label": "D", "text": "500mg TM/12h"}], "answer": "B"}, {"number": 16, "question": "Bệnh nhân viêm phổi cộng đồng dị ứng với kháng sinh betalactam, sự lựa chọn kháng sinh thay thế được khuyến cáo là:", "options": [{"label": "A", "text": "Macrolide"}, {"label": "B", "text": "Fluoroquinolone"}, {"label": "C", "text": "Aminoglycosid"}, {"label": "D", "text": "Cephalosporin"}], "answer": "B"}, {"number": 17, "question": "Về dịch tể học viêm phổi bệnh viện, chọn Câu sai:", "options": [{"label": "A", "text": "Nhiễm trùng bệnh viện gây tử vong cao nhất và kéo dài thời gian nằm viện"}, {"label": "B", "text": "Sự đề kháng kháng sinh của các vi khuẩn gây viêm phổi bệnh viện là một vấn đề nghiêm trọng"}, {"label": "C", "text": "Các vi khuẩn họ Enterobacteriacae sinh ESBL và Carbapenemase gây đề kháng nhiều kháng sinh carbapenem"}, {"label": "D", "text": "MRSA cũng có khả năng kháng với betalactam và carbapenem chiếm tỉ lệ 50 – 60%"}], "answer": "C"}, {"number": 18, "question": "Trong điều trị viêm phổi bệnh viện, liều Colistimethate cho 1 người 60 kg được tính như sau: (1) Liều tải Colistin = 4 x 60 kg = 240 mg CBA(colistin base activity) = 7.200.000 IU colistimethate (2) Liều duy trì = 2,5 mg CBA/kg = 30.000 x 2,5 x 60 kg = 4.500.000 IU colistimethate", "options": [{"label": "A", "text": "(1) đúng, (2) sai"}, {"label": "B", "text": "(2) đúng, (1) sai"}, {"label": "C", "text": "(1) đúng, (2) đúng"}, {"label": "D", "text": "(1) sai, (2) sai"}], "answer": "C"}, {"number": 19, "question": "Các yếu tố nguy cơ viêm phổi hít là, NGOẠI TRỪ:", "options": [{"label": "A", "text": "Đặt nội khí quản."}, {"label": "B", "text": "Dùng thuốc an thần liều cao."}, {"label": "C", "text": "Phẫu thuật ngực – bụng."}, {"label": "D", "text": "Thời gian điều trị nội trú kéo dài."}], "answer": "D"}, {"number": 20, "question": "Phương pháp cấy định lượng chất tiết đường hô hấp dưới qua kỹ thuật nội soi phế quản với chất tiết nội khí quản yêu cầu có ngưỡng vi khuẩn là:", "options": [{"label": "A", "text": "> 1 x 106 CFU/ml"}, {"label": "B", "text": "> 1 x 105 CFU/ml"}, {"label": "C", "text": "> 1 x 104 CFU/ml"}, {"label": "D", "text": "> 1 x 103 CFU/ml"}], "answer": "A"}, {"number": 21, "question": "Về hình ảnh học của HAP, hình ảnh tổn thương dạng nốt (kích thước từ vài mm đến vài cm), không đồng nhất, bờ mờ, không đều, có thể lan toả 2 bên kèm tràn dịch màng phổi, thường gặp do:", "options": [{"label": "A", "text": "Staphylococcus aureus."}, {"label": "B", "text": "Streptococcus pneumoniae."}, {"label": "C", "text": "Pseudomonas aeruginosA."}, {"label": "D", "text": "Acinetobacter baumannii."}], "answer": "A"}, {"number": 22, "question": "Chẩn đoán Viêm phổi bệnh viện theo CDC, về triệu chứng hô hấp, chọn Câu sai:", "options": [{"label": "A", "text": "Xuất hiện kéo dài: đàm mủ, thay đổi màu đàm, tăng tiết đàm."}, {"label": "B", "text": "Mới xuất hiện hoặc xấu đi: ho, khó thở, nhịp tim nhanh."}, {"label": "C", "text": "Tiếng ran hoặc tiếng thở phế quản."}, {"label": "D", "text": "Tình trạng oxy máu xấu đi, PaO2/FiO2 ≤ 240/cần tăng oxy/cần thở máy."}], "answer": "A"}, {"number": 23, "question": "Bệnh nhân nữ, 65 tuổi, vào viện vì đau ngực, được chẩn đoán nhồi máu cơ tim cấp. Sau 3 ngày điều trị, bệnh nhân tăng khó thở, thở khò khè, ho, đàm đục. Nên ưu tiên làm cận lâm sàng gì cho bệnh nhân:", "options": [{"label": "A", "text": "Xét nghiệm lại Troponin Ths"}, {"label": "B", "text": "Chụp Xquang ngực thẳng."}, {"label": "C", "text": "Xét nghiệm công thức máu, CRP, PCT."}, {"label": "D", "text": "Chụp CT scan ngực (có cản quang)."}], "answer": "B"}, {"number": 24, "question": "Bệnh nhân nam, 67 tuổi, vào viện đợt cấp COPD, sau thở máy 3 ngày bệnh nhân có biểu hiện tăng nhiệt độ 390C, đàm đục, thở 28 l/ph, mạch 110 l/ph, bạch cầu máu 15.000/mm3 , CRP = 15 mg/dl, SpO2 = 88% (FiO2: 40%), Xquang ngực có thâm nhiễm khu trú đáy phổi (P). Điều trị kháng sinh kinh nghiệm cho bệnh nhân:", "options": [{"label": "A", "text": "Ceftazidime 2g IV q8h + Amikacin 15-20 mg/kg IV"}, {"label": "B", "text": "Amikacin 15-20 mg/kg IV + Vancomycin 15mg/kg IV q8-12h"}, {"label": "C", "text": "Gentamicin 5-7 mg/kg IV + Linezolid 600mg IV q12h"}, {"label": "D", "text": "Ceftriaxone 2g IV q24h + Linezolid 600mg IV q12h"}], "answer": "A"}, {"number": 25, "question": "Bệnh nhân tràn khí màng phổi/COPD thuộc phân loại tràn khí màng phổi nào:", "options": [{"label": "A", "text": "Tràn khí màng phổi tự phát nguyên phát"}, {"label": "B", "text": "Tràn khí màng phổi tự phát thứ phát"}, {"label": "C", "text": "Tràn khí màng phổi do cơ học"}, {"label": "D", "text": "Tràn khí màng phổi do chấn thương"}], "answer": "B"}, {"number": 26, "question": "Khám thực thể bệnh nhân tràn khí màng phổi áp lực, chọn câu sai:", "options": [{"label": "A", "text": "Không có biểu hiện suy hô hấp mức độ từ nhẹ đến nặng do sự tích tụ dần không khí trong khoang màng phổi."}, {"label": "B", "text": "Ảnh hưởng đến cung lượng tim, gây hạ huyết áp và thiếu oxy đe dọa tính mạng."}, {"label": "C", "text": "Bệnh nhân không có tiếng thở ở vùng bị ảnh hưởng, lệch khí quản sang một bên, nhịp tim nhanh và căng giãn tĩnh mạch."}, {"label": "D", "text": "Bệnh nhân có thể ở tình trạng trụy mạch, ngừng tim, nếu không được cấp cứu kịp thời bệnh nhân có thể tử vong nhanh chóng."}], "answer": "A"}, {"number": 27, "question": "Đặc điểm hình ảnh Xquang ngực điển hình của tràn khí màng phổi, chọn câu sai:", "options": [{"label": "A", "text": "Hội chứng khí phế thủng"}, {"label": "B", "text": "Không có hình ảnh mạch máu"}, {"label": "C", "text": "Thấy rõ bờ màng phổi tạng"}, {"label": "D", "text": "Nhu mô phổi thu nhỏ về rốn phổi"}], "answer": "A"}, {"number": 28, "question": "Nếu nghi ngờ bệnh nhân có bóng khí hoặc u nang, phân biệt với tràn khí màng phổi có dính màng phổi nên làm gì:", "options": [{"label": "A", "text": "Chụp Xquang ngực nghiêng"}, {"label": "B", "text": "Chụp CT scan ngực"}, {"label": "C", "text": "Siêu âm màng phổi"}, {"label": "D", "text": "Đo chức năng hô hấp"}], "answer": "B"}, {"number": 29, "question": "Dùng bột Talc y tế tinh khiết phun vào khoang màng phổi giúp giảm tỷ lệ tái phát tràn khí màng phổi:", "options": [{"label": "A", "text": "20%"}, {"label": "B", "text": "30%"}, {"label": "C", "text": "40%"}, {"label": "D", "text": "50%"}], "answer": "D"}, {"number": 30, "question": "Chỉ định đặt ống dẫn lưu khoang màng phổi trong trường hợp tràn khí màng phổi nào, chọn Câu sai:", "options": [{"label": "A", "text": "tràn khí màng phổi tự phát lượng nhiều"}, {"label": "B", "text": "tràn khí màng phổi tự phát nguyên phát"}, {"label": "C", "text": "tràn khí màng phổi do chấn thương"}, {"label": "D", "text": "tràn khí màng phổi 2 bên"}], "answer": "B"}, {"number": 31, "question": "Điều trị bảo tồn nội khoa và theo dõi nội viện, chụp kiểm tra Xquang ngực thẳng mỗi ngày là hướng xử trí ở bệnh nhân tràn khí màng phổi như thế nào, chọn câu sai:", "options": [{"label": "A", "text": "TKMP lượng nhiều"}, {"label": "B", "text": "Bệnh nhân không khó thở"}, {"label": "C", "text": "Bệnh nhân huyết động ổn định"}, {"label": "D", "text": "Kích thước khoang TKMP không tăng lên sau 6 – 8 giờ"}], "answer": "A"}, {"number": 32, "question": "Nếu hết tràn khí màng phổi thì sau bao lâu nên rút kim dẫn lưu khí:", "options": [{"label": "A", "text": "rút kim ngay"}, {"label": "B", "text": "sau 6 giờ"}, {"label": "C", "text": "sau 12 giờ"}, {"label": "D", "text": "sau 24 giờ"}], "answer": "D"}, {"number": 33, "question": "Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi cận viêm, khi xác định chọc dịch màng phổi không loại bỏ được hết dịch thì cần làm gì tiếp theo:", "options": [{"label": "A", "text": "Xác định yếu tố tiên lượng xấu có không"}, {"label": "B", "text": "Hội chẩn bác sĩ phẩu thuật phổi và lồng ngực"}, {"label": "C", "text": "Đặt ống dẫn lưu lồng ngực"}, {"label": "D", "text": "Đánh giá dịch màng phổi tái lập như thế nào"}], "answer": "A"}, {"number": 34, "question": "Dịch màng phổi được thành lập từ các thay đổi sau, CHỌN CÂU SAI:", "options": [{"label": "A", "text": "Giảm dịch kẽ trong phổi: suy thất trái, viêm phổi và thuyên tắc phổi"}, {"label": "B", "text": "Tăng áp lực thủy tĩnh mao mạch trong màng phổi: suy thất phải hoặc trái, hội chứng tĩnh mạch chủ trên"}, {"label": "C", "text": "Tăng tính thấm của mao mạch màng phổi: viêm màng phổi"}, {"label": "D", "text": "Giảm áp lực trong khoang màng phổi: xẹp phổi hoặc tăng độ đàn hồi của phổi"}], "answer": "A"}, {"number": 35, "question": "Dịch màng phổi do Lao KHÔNG CÓ đặc điểm sau:", "options": [{"label": "A", "text": "Thường có màu vàng chanh hơn là mủ."}, {"label": "B", "text": "Tái lập nhanh do liên quan đến phản ứng miễn dịch quá đáng."}, {"label": "C", "text": "Dịch có thể hết cả khi không điều trị."}, {"label": "D", "text": "Rất giàu trực khuẩn lao trong dịch."}], "answer": "D"}, {"number": 36, "question": "Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi cận viêm, khi xác định bệnh nhân có khả năng phẩu thuật màng phổi tốt thì cần làm gì tiếp theo:", "options": [{"label": "A", "text": "Xem xét VATS sớm"}, {"label": "B", "text": "Siêu âm lồng ngực lại"}, {"label": "C", "text": "Đặt ống dẫn lưu lồng ngực 14-F"}, {"label": "D", "text": "Xem xét t-PA-Dnase"}], "answer": "A"}, {"number": 37, "question": "Về đặc điểm siêu âm màng phổi trong tràn dịch màng phổi, chọn Câu sai:", "options": [{"label": "A", "text": "Giúp phát hiện tràn dịch khu trú, phân biệt tràn dịch với dày dính màng phổi và hướng dẫn chọc dò màng phổi trong những trường hợp khó."}, {"label": "B", "text": "Đo thể tích dịch màng phổi bằng siêu âm được cho là chính xác hơn phương pháp đo bằng X quang tư thế nằm."}, {"label": "C", "text": "Với siêu âm, thể tích dịch màng phổi được thấy là tương quan với độ tách biệt của 2 lá màng phổi."}, {"label": "D", "text": "Có thể ước tính lượng dịch có thể rút ra được bằng cách lấy khoảng cách lớn nhất giữa lá tạng và lá thành (đo ở mặt cắt ngang) nhân với 10."}], "answer": "D"}, {"number": 38, "question": "Chỉ định điều trị kháng sinh trong viêm mủ màng phổi:", "options": [{"label": "A", "text": "Phải chỉ định sớm ngay khi phát hiện mủ màng phổi"}, {"label": "B", "text": "Phải chờ kết quả cấy vi trùng và kháng sinh đồ"}, {"label": "C", "text": "Có thể dùng tạm kháng sinh đường uống để chờ kết quả cấy vi trùng"}, {"label": "D", "text": "Chỉ đưa kháng sinh điều trị tại chỗ màng phổi"}], "answer": "A"}, {"number": 39, "question": "Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết thì bác sĩ làm gì tiếp theo:", "options": [{"label": "A", "text": "Tiến hành các kỹ thuật chẩn đoán sâu hơn"}, {"label": "B", "text": "Điều trị suy tim, xơ gan, bệnh thận"}, {"label": "C", "text": "Không làm gì thêm để chẩn đoán"}, {"label": "D", "text": "Nội soi màng phổi hoặc sinh thiết màng phổi"}], "answer": "A"}, {"number": 40, "question": "Trong sơ đồ tiếp cận tràn dịch màng phổi (TDMP) theo tiêu chuẩn Light, sau khi theo dõi người bệnh không cải thiện triệu chứng TDMP thì bác sĩ cần làm gì tiếp theo:", "options": [{"label": "A", "text": "Tiếp tục tiến hành lại các kỹ thuật chẩn đoán TDMP"}, {"label": "B", "text": "Xem xét soi màng phổi hoặc sinh thiết màng phổi"}, {"label": "C", "text": "Xét nghiệm dịch màng phổi tìm lao"}, {"label": "D", "text": "Điều trị thuyên tắc phổi"}], "answer": "B"}], [{"number": 1, "question": "Trong viêm phổi thuỳ, theo mô tả của Laennec, giai đoạn sung huyết là:", "options": [{"label": "A", "text": "Tổ chức phổi bị thương tổn có màu đỏ sẫm và chắc như gan, trong tổ chức này có thể có xuất huyết"}, {"label": "B", "text": "Thương tổn phổi có màu nâu xám chứa hồng cầu, bạch cầu, vi khuẩn và tổ chức hoại tử"}, {"label": "C", "text": "Các mao mạch thành phế nang giãn ra, hồng cầu, bạch cầu và fibrin thoát vào trong lòng phế nang"}, {"label": "D", "text": "Phế nang còn ít dịch loãng, có ít bạch cầu"}], "answer": "C"}, {"number": 2, "question": "Thuật ngữ Viêm phổi cộng đồng, Viêm phổi bệnh viện, Viêm phổi liên quan tới chăm sóc y tế, Viêm phổi thở máy là để:", "options": [{"label": "A", "text": "Chỉ tình trạng nặng hay nhẹ của viêm phổi"}, {"label": "B", "text": "Để định hướng tác nhân vi sinh gây bệnh"}, {"label": "C", "text": "Chỉ điều kiện y tế cần chăm sóc đặc biệt"}, {"label": "D", "text": "Để phân loại bệnh học viêm phổi"}], "answer": "B"}, {"number": 3, "question": "Chọn 1 Câu sai trong những trả lời sau đây: Chẩn đoán và đánh giá viêm phổi ở cộng đồng", "options": [{"label": "A", "text": "Xquang ngực là cần thiết khi chẩn đoán viêm phổi ở cộng đồng"}, {"label": "B", "text": "Trên người trẻ tiền sử khỏe mạnh, với bệnh cảnh nhiễm trùng hô hấp cấp tính có triệu chứng thực thể phổi có thể chẩn đoán viêm phổi không cần chụp Xquang ngực nếu điều trị ngoài bệnh viện."}, {"label": "C", "text": "Cần xét nghiệm công thức máu và Xquang ngực thẳng cho tất cả các trường hợp chẩn đoán viêm phổi ở cộng đồng"}, {"label": "D", "text": "Không cần xét nghiệm ure máu cho tất cả các trường hợp chẩn đoán viêm phổi ở cộng đồng."}], "answer": "C"}, {"number": 4, "question": "Tác nhân nào sau đây KHÔNG phải là nguyên nhân gây viêm phổi cộng đồng:", "options": [{"label": "A", "text": "Streptococcus pneumoniae"}, {"label": "B", "text": "Haemophilus influenzae"}, {"label": "C", "text": "Mycobacterium tuberculosis"}, {"label": "D", "text": "Klebsiella pneumonia"}], "answer": "C"}, {"number": 5, "question": "Các yếu tố nguy cơ nhiễm P.aeruginosa đề kháng kháng sinh ở bệnh nhân viêm phổi cộng đồng bao gồm:", "options": [{"label": "A", "text": "Tiền sử đã nhiễm tụ cầu kháng Methicilline"}, {"label": "B", "text": "Tiền sử đã nhiễm phế cầu kháng Penicilline"}, {"label": "C", "text": "Có bệnh cấu trúc phổi"}, {"label": "D", "text": "Nhiễm trùng da tái diễn"}], "answer": "C"}, {"number": 6, "question": "Chọn 1 Câu đúng trong những Câu trả lời sau đây: Thuật ngữ điều trị kháng sinh kinh nghiệm dùng để chỉ:", "options": [{"label": "A", "text": "Điều trị kháng sinh theo kinh nghiệm của thầy thuốc lâm sàng"}, {"label": "B", "text": "Điều trị kháng sinh theo khuyến cáo dựa trên bằng chứng y học"}, {"label": "C", "text": "Điều trị kháng sinh dựa trên vi khuẩn gây bệnh phổ biến tại địa phương"}, {"label": "D", "text": "Điều trị kháng sinh không dựa trên xét nghiệm vi sinh"}], "answer": "D"}, {"number": 7, "question": "Hình ảnh Xquang ngực sau phù hợp thể viêm phổi nào ” đám mờ hình tam giác hoặc hình thang có đáy hướng ra ngoài thành ngực, thường khu trú ở thuỳ giữa và dưới, bên phải nhiều hơn bên trái, bên trong có hình ảnh phế quản hơi, không phì đại hạch rốn phổi”:", "options": [{"label": "A", "text": "Viêm phổi thùy"}, {"label": "B", "text": "Phế quản phế viêm"}, {"label": "C", "text": "Viêm phổi mô kẽ"}, {"label": "D", "text": "Viêm phổi không điển hình"}], "answer": "A"}, {"number": 8, "question": "Sự phối hợp kháng sinh nào được khuyến cáo trong điều trị viêm phổi cộng đồng nguy cơ nặng:", "options": [{"label": "A", "text": "Macrolide mới + Beta lactam"}, {"label": "B", "text": "Beta lactam + Aminoglycosid"}, {"label": "C", "text": "Beta lactam + fluoroquinolone"}, {"label": "D", "text": "Cephalosporin + fluoroquinolone"}], "answer": "C"}, {"number": 9, "question": "Về dịch tể học viêm phổi bệnh viện, chọn Câu sai:", "options": [{"label": "A", "text": "Nhiễm trùng bệnh viện gây tử vong cao nhất và kéo dài thời gian nằm viện"}, {"label": "B", "text": "Các vi khuẩn họ Enterobacteriacae sinh ESBL gây đề kháng nhiều kháng sinh carbapenem"}, {"label": "C", "text": "Sự đề kháng kháng sinh của các vi khuẩn gây viêm phổi bệnh viện là một vấn đề nghiêm trọng"}, {"label": "D", "text": "MRSA cũng có khả năng kháng với betalactam và Carbapenem chiếm tỉ lệ 50 – 60%"}], "answer": "B"}, {"number": 10, "question": "Đặt nội khí quản thở máy là yếu tố nguy cơ quan trọng nhất của viêm phổi bệnh viện vì gây, ngoại trừ:", "options": [{"label": "A", "text": "Thay đổi pH dạ dày"}, {"label": "B", "text": "Trở ngại nuốt chất tiết"}, {"label": "C", "text": "Nơi chứa vi khuẩn"}, {"label": "D", "text": "Máy thở và dụng cụ bị nhiễm"}], "answer": "A"}, {"number": 11, "question": "Khi quyết định điều trị kháng sinh kinh nghiệm trong VPBV thì yếu tố nào là quan trọng nhất để đối phó với vi khuẩn kháng thuốc:", "options": [{"label": "A", "text": "Kết quả nuôi cấy trước đó"}, {"label": "B", "text": "Sử dụng kháng sinh trước đó"}, {"label": "C", "text": "Thời gian nằm trong bệnh viện (hay thở máy)"}, {"label": "D", "text": "Tình trạng suy giảm miễn dịch và đặc điểm kháng thuốc thông thường của vi sinh gây bệnh tại cơ sở điều trị"}], "answer": "C"}, {"number": 12, "question": "Về lâm sàng của viêm phổi bệnh viện, tính phổ biến của tác nhân vi sinh phụ thuộc vào các yếu tố, NGOẠI TRỪ:", "options": [{"label": "A", "text": "Tình trạng miễn dịch của người bệnh."}, {"label": "B", "text": "Thời gian khởi phát."}, {"label": "C", "text": "Các nguy cơ nhiễm khuẩn đặc biệt."}, {"label": "D", "text": "Các yếu tố nguy cơ nhiễm vi khuẩn đa kháng."}], "answer": "C"}, {"number": 13, "question": "Bệnh nhân nam, 67 tuổi, vào viện đợt cấp COPD, sau thở máy 3 ngày bệnh nhân có biểu hiện tăng nhiệt độ 390C, đàm đục, thở 28 l/ph, mạch 110 l/ph, bạch cầu máu 15.000/mm3 , CRP = 15 mg/dl, SpO2 = 88% (FiO2: 40%), Xquang ngực có thâm nhiễm khu trú đáy phổi (P). Điều trị kháng sinh kinh nghiệm cho bệnh nhân:", "options": [{"label": "A", "text": "Ceftazidime 2g IV q8h + Ciprofloxacin 400mg IV q8h"}, {"label": "B", "text": "Amikacin 15-20 mg/kg IV + Vancomycin 15mg/kg IV q8-12h"}, {"label": "C", "text": "Gentamicin 5-7 mg/kg IV + Linezolid 600mg IV q12h"}, {"label": "D", "text": "Ceftriaxone 2g IV q24h + Linezolid 600mg IV q12h"}], "answer": "A"}, {"number": 14, "question": "Chẩn đoán Viêm phổi bệnh viện theo CDC, về triệu chứng hô hấp, chọn Câu sai:", "options": [{"label": "A", "text": "Mới xuất hiện hoặc xấu đi: ho, khó thở, nhịp tim nhanh."}, {"label": "B", "text": "Tiếng ran hoặc tiếng thở phế quản."}, {"label": "C", "text": "Xuất hiện kéo dài: đàm mủ, thay đổi màu đàm, tăng tiết đàm."}, {"label": "D", "text": "Tình trạng oxy máu xấu đi, PaO2/FiO2 ≤ 240/cần tăng oxy/cần thở máy."}], "answer": "C"}, {"number": 15, "question": "Bệnh nhân nữ, 65 tuổi, vào viện vì đau ngực, được chẩn đoán nhồi máu cơ tim cấp. Sau 3 ngày điều trị, bệnh nhân tăng khó thở, thở khò khè, ho, đàm đục. Nên ưu tiên làm cận lâm sàng gì cho bệnh nhân:", "options": [{"label": "A", "text": "Xét nghiệm lại Troponin Ths"}, {"label": "B", "text": "Xét nghiệm công thức máu, CRP, PCT."}, {"label": "C", "text": "Chụp Xquang ngực thẳng."}, {"label": "D", "text": "Chụp CT scan ngực (có cản quang)."}], "answer": "C"}, {"number": 16, "question": "Vi khuẩn thường gặp trong viêm phổi thở máy xuất hiện muộn và kháng nhiều loại -lactam là:", "options": [{"label": "A", "text": "Staphylococcus aureus."}, {"label": "B", "text": "Streptococcus pneumoniae."}, {"label": "C", "text": "Acinetobacter baumannii."}, {"label": "D", "text": "Pseudomonas aeruginosa."}], "answer": "D"}, {"number": 17, "question": "Vai trò của đại thực bào trong cơ chế bệnh sinh bệnh phổi tắc nghẽn mạn tính:", "options": [{"label": "A", "text": "Tiết ra Neutrophil elastase, Neutrophil cathepsin G và Neutrophil proteinase-3"}, {"label": "B", "text": "Giải phóng perforin, granzym B và TNF-α"}, {"label": "C", "text": "Giải phóng các chất oxy hoá, oxit nitơ, yếu tố hoại tử u (TNF- α), IL-8, LTB-4"}, {"label": "D", "text": "Tiết ra các anti -proteinase"}], "answer": "C"}, {"number": 18, "question": "Tình trạng tăng áp động mạch phổi ở bệnh phổi tắc nghẽn mạn tính xuất hiện khi giảm oxy máu:", "options": [{"label": "A", "text": "< 65mmHg"}, {"label": "B", "text": "< 60mmHg"}, {"label": "C", "text": "< 55mmHg"}, {"label": "D", "text": "< 50mmHg"}], "answer": "B"}, {"number": 19, "question": "Bệnh nhân nam, 60 tuổi, được chẩn đoán bệnh phổi tắc nghẽn mạn tính FEV1 78%, nhóm B. Đánh giá triệu chứng/nguy cơ đợt kịch phát của bệnh nhân này:", "options": [{"label": "A", "text": "Ít triệu chứng, nguy cơ thấp"}, {"label": "B", "text": "Ít triệu chứng, nguy cơ cao"}, {"label": "C", "text": "Nhiều triệu chứng, nguy cơ thấp"}, {"label": "D", "text": "Nhiều triệu chứng, nguy cơ cao"}], "answer": "C"}, {"number": 20, "question": "Vi khuẩn gây bệnh phổ biến trong đợt cấp bệnh phổi tắc nghẽn mạn tính ngoại trú, NGOẠI TRỪ:", "options": [{"label": "A", "text": "Streptococcus pneumoniae"}, {"label": "B", "text": "Mycoplasma catarrhalis"}, {"label": "C", "text": "Haemophilus influenzae"}, {"label": "D", "text": "Speudomonas.aeruginosa"}], "answer": "D"}, {"number": 21, "question": "Liệu pháp thuốc nào có vai trò chính trong kiểm soát triệu chứng COPD giai đoạn ổn định?", "options": [{"label": "A", "text": "Thuốc kháng viêm."}, {"label": "B", "text": "Thuốc giãn phế quản."}, {"label": "C", "text": "Thuốc tăng huyết áp."}, {"label": "D", "text": "Thuốc chống trầm cảm"}], "answer": "B"}, {"number": 22, "question": "Thuốc giãn phế quản thuộc nhóm kích thích beta 2 adrenergic trong xử trí đợt cấp bệnh phổi tắc nghẽn mạn tính, NGOẠI TRỪ:", "options": [{"label": "A", "text": "Salbutamol"}, {"label": "B", "text": "Terbutalin"}, {"label": "C", "text": "Bambuterol"}, {"label": "D", "text": "Ipratropium"}], "answer": "D"}, {"number": 23, "question": "Chỉ định tiêm ngừa nào là ưu tiên cho bệnh nhân COPD?", "options": [{"label": "A", "text": "Vắc xin ho gà."}, {"label": "B", "text": "Vắc xin phế cầu."}, {"label": "C", "text": "Vắc xin cúm."}, {"label": "D", "text": "Vắc xin sốt rét."}], "answer": "C"}, {"number": 24, "question": "Thông khí NIPPV trong đợt cấp bệnh phổi tắc nghẽn mạn tính nhằm các mục tiêu sau, NGOẠI TRỪ:", "options": [{"label": "A", "text": "Giảm CO2"}, {"label": "B", "text": "Giảm tử vong trong thời gian nằm viện"}, {"label": "C", "text": "Giảm thông khí phổi"}, {"label": "D", "text": "Tránh đặt nội khí quản và thở máy can thiệp"}], "answer": "C"}, {"number": 25, "question": "Bệnh nhân tràn khí màng phổi/COPD thuộc phân loại tràn khí màng phổi nào:", "options": [{"label": "A", "text": "Tràn khí màng phổi do cơ học"}, {"label": "B", "text": "Tràn khí màng phổi do chấn thương"}, {"label": "C", "text": "Tràn khí màng phổi tự phát nguyên phát"}, {"label": "D", "text": "Tràn khí màng phổi tự phát thứ phát"}], "answer": "D"}, {"number": 26, "question": "Về cơ chế bệnh sinh TKMP, cơ chế đề xuất vỡ phế nang tự phát gây tràn khí màng phổi là:", "options": [{"label": "A", "text": "Áp suất trong bao phế quản mạch máu liền kề vẫn thấp hơn so với trong phế nang căng phồng quá mức."}, {"label": "B", "text": "Áp suất trong bao phế quản mạch máu liền kề vẫn cao hơn so với trong phế nang căng phồng quá mức."}, {"label": "C", "text": "Áp suất trong bao phế quản mạch máu liền kề bằng với trong phế nang căng phồng quá mức."}, {"label": "D", "text": "Không liên quan về áp suất trong bao phế quản mạch máu và phế nang căng phồng quá mức."}], "answer": "A"}, {"number": 27, "question": "Đặc điểm hình ảnh Xquang ngực của tràn khí màng phổi, chọn câu sai:", "options": [{"label": "A", "text": "Đối với những trường hợp nghi ngờ tràn khí màng phổi nhưng trên phim thẳng không phát hiện được thì tiến hành chụp phim phổi nghiêng."}, {"label": "B", "text": "Không phụ thuộc mức độ tràn khí màng phổi nhiều hay ít mà trên phim X-quang có thể thấy phổi bên bệnh bị xẹp nhiều hay ít."}, {"label": "C", "text": "Trường hợp tràn khí màng phổi nhiều, nhu mô phổi co cụm lại về phía rốn phổi bên tràn khí."}, {"label": "D", "text": "Hình ảnh phổi tăng sáng, không có hình ảnh mạch máu, ở vùng ngoài thành ngực có thể thấy rõ bờ màng phổi tạng."}], "answer": "B"}, {"number": 28, "question": "Hình ảnh tràn khí màng phổi khu trú trên Xquang ngực cần phân biệt với:", "options": [{"label": "A", "text": "Khí phế thủng toàn thể"}, {"label": "B", "text": "Áp xe phổi giai đoạn nung mủ hở"}, {"label": "C", "text": "Kén phổi"}, {"label": "D", "text": "Hang lao"}], "answer": "C"}, {"number": 29, "question": "Về nội soi màng phổi trong tràn khí màng phổi, chọn Câu sai:", "options": [{"label": "A", "text": "Chỉ định trong tràn khí màng phổi lượng nhiều thất bại với các biện pháp dẫn lưu khoang màng phổi, tràn khí màng phổi lần đầu."}, {"label": "B", "text": "Các thủ thuật ngoại khoa có thể tiến hành qua nội soi màng phổi có video trợ giúp như gây dính, cắt các bóng khí, khâu lỗ thủng màng phổi."}, {"label": "C", "text": "Nội soi màng phổi mang lại kết quả tương đương với phẫu thuật kinh điển, nhưng nhẹ nhàng hơn gấp nhiều lần."}, {"label": "D", "text": "Mục tiêu nội soi màng phổi là đóng kín lại chỗ dò khí từ phổi, dùng kim chỉ may thông thường, dùng stapler."}], "answer": "A"}, {"number": 30, "question": "Nếu nghi ngờ bệnh nhân có bóng khí hoặc u nang, phân biệt với tràn khí màng phổi có dính màng phổi nên làm gì:", "options": [{"label": "A", "text": "Chụp Xquang ngực nghiêng"}, {"label": "B", "text": "Siêu âm màng phổi"}, {"label": "C", "text": "Đo chức năng hô hấp"}, {"label": "D", "text": "Chụp CT scan ngực"}], "answer": "D"}, {"number": 31, "question": "Tốc độ tái hấp thu khí trong tràn khí màng phổi phụ thuộc vào các yếu tố, ngoại trừ:", "options": [{"label": "A", "text": "chênh lệch áp suất đối với khí giữa khoang màng phổi và máu tĩnh mạch"}, {"label": "B", "text": "đặc tính khuếch tán của các khí có mặt trong khoang màng phổi"}, {"label": "C", "text": "vùng tiếp xúc giữa khí màng phổi và màng phổi"}, {"label": "D", "text": "tính thấm của bề mặt động mạch phổi"}], "answer": "D"}, {"number": 32, "question": "Khi hết tràn khí màng phổi cần lưu kim dẫn lưu khí 24 giờ để làm gì:", "options": [{"label": "A", "text": "để theo dõi tràn khí màng phổi có tái phát không"}, {"label": "B", "text": "để theo dõi có tràn dịch màng phổi kèm theo không"}, {"label": "C", "text": "để theo dõi có tràn khí dưới da tăng lên không"}, {"label": "D", "text": "để kích thích gây dính màng phổi"}], "answer": "D"}, {"number": 33, "question": "Trong sơ đồ tiếp cận điều trị tràn dịch màng phổi cận viêm, khi xác định có dịch màng phổi tái lập thì cần làm gì tiếp theo:", "options": [{"label": "A", "text": "Xem xét VATS sớm"}, {"label": "B", "text": "Siêu âm lồng ngực lại"}, {"label": "C", "text": "Đặt ống dẫn lưu lồng ngực"}, {"label": "D", "text": "Tiếp tục kháng sinh"}], "answer": "B"}, {"number": 34, "question": "Dịch màng phổi được thành lập từ các thay đổi sau, CHỌN CÂU SAI:", "options": [{"label": "A", "text": "Tăng áp lực thủy tĩnh mao mạch trong màng phổi: suy thất phải hoặc trái, hội chứng tĩnh mạch chủ trên"}, {"label": "B", "text": "Tăng tính thấm của mao mạch màng phổi: viêm màng phổi"}, {"label": "C", "text": "Giảm áp lực trong khoang màng phổi: xẹp phổi hoặc tăng độ đàn hồi của phổi"}, {"label": "D", "text": "Giảm dịch kẽ trong phổi: suy thất trái, viêm phổi và thuyên tắc phổi"}], "answer": "D"}, {"number": 35, "question": "Dịch màng phổi do Lao KHÔNG CÓ đặc điểm sau:", "options": [{"label": "A", "text": "Thường có màu vàng chanh hơn là mủ."}, {"label": "B", "text": "Tái lập nhanh do liên quan đến phản ứng miễn dịch quá đáng."}, {"label": "C", "text": "Rất giàu trực khuẩn lao trong dịch."}, {"label": "D", "text": "Dịch có thể hết cả khi không điều trị."}], "answer": "C"}, {"number": 36, "question": "Glucose trong dịch màng phổi rất thấp thường gặp trong:", "options": [{"label": "A", "text": "Ung thư màng phổi"}, {"label": "B", "text": "Viêm mủ màng phổi"}, {"label": "C", "text": "Lao màng phổi"}, {"label": "D", "text": "Suy tim, suy thận"}], "answer": "B"}, {"number": 37, "question": "Về đặc điểm siêu âm màng phổi trong tràn dịch màng phổi, chọn Câu sai:", "options": [{"label": "A", "text": "Giúp phát hiện tràn dịch khu trú, phân biệt tràn dịch với dày dính màng phổi và hướng dẫn chọc dò màng phổi trong những trường hợp khó."}, {"label": "B", "text": "Có thể ước tính lượng dịch có thể rút ra được bằng cách lấy khoảng cách lớn nhất giữa lá tạng và lá thành (đo ở mặt cắt ngang) nhân với 10."}, {"label": "C", "text": "Đo thể tích dịch màng phổi bằng siêu âm được cho là chính xác hơn phương pháp đo bằng X quang tư thế nằm."}, {"label": "D", "text": "Với siêu âm, thể tích dịch màng phổi được thấy là tương quan với độ tách biệt của 2 lá màng phổi."}], "answer": "B"}, {"number": 38, "question": "Trong sơ đồ tiếp cận tràn dịch màng phổi theo tiêu chuẩn Light, sau khi thực hiện chọc dịch màng phổi chẩn đoán với kết luận dịch tiết và tiến hành các kỹ thuật chẩn đoán sâu hơn nhưng bác sĩ vẫn không có chẩn đoán thì bác sĩ cần quyết định sao:", "options": [{"label": "A", "text": "Tiếp tục tiến hành các kỹ thuật chẩn đoán"}, {"label": "B", "text": "Thực hiện chọc dịch màng phổi chẩn đoán lại"}, {"label": "C", "text": "Xét nghiệm dịch màng phổi tìm lao"}, {"label": "D", "text": "Xem xét thuyên tắc phổi"}], "answer": "D"}, {"number": 39, "question": "Trong tràn dịch màng phổi, đặc điểm chẩn đoán tế bào học, chọn Câu sai:", "options": [{"label": "A", "text": "Đòi hỏi người đọc tiêu bản phải có kinh nghiệm vì tế bào màng phổi có thể chuyển dạng tạo hình ảnh giống ác tính."}, {"label": "B", "text": "Sự hiện diện tế bào bất thường trong dịch màng phổi có khả năng chẩn đoán thấp do phụ thuộc mức độ lan rộng và loại tế bào ung thư."}, {"label": "C", "text": "Kỹ thuật khối tế bào (cell block) không làm tăng khả năng chẩn đoán nguyên nhân ác tính."}, {"label": "D", "text": "Mọi bệnh nhân tràn dịch màng phổi dịch tiết nên được xét nghiệm tế bào học dịch màng phổi."}], "answer": "C"}, {"number": 40, "question": "Bệnh nhân xơ gan, đã loại trừ viêm phổi nếu nuôi cấy dịch màng phổi dương tính vi khuẩn và có số lượng bạch cầu trung tính > 250 tế bào/mm3 hoặc nuôi cấy âm tính và số lượng bạch cầu trung tính >500 tế bào/mm3 thì nghĩ đến vấn đề gì:", "options": [{"label": "A", "text": "Viêm màng phổi do vi khuẩn."}, {"label": "B", "text": "Viêm màng phổi phản ứng."}, {"label": "C", "text": "Tràn dịch màng phổi cận viêm."}, {"label": "D", "text": "Tràn dịch màng phổi dịch thấm"}], "answer": "A"}]];
let selectedExam=0, questions=[], answers={}, marks=new Set(), idx=0, seconds=0, initialSeconds=0, ticker=null, submitted=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function shuffleArray(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
$$('.exam-btn').forEach(b=>b.onclick=()=>{$$('.exam-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedExam=+b.dataset.exam});
$('#startBtn').onclick=startQuiz;
function startQuiz(){
  const mins=Math.max(5,Math.min(180,+$('#minutes').value||40));
  questions=BANK[selectedExam].map(q=>({...q})); if($('#shuffle').checked) questions=shuffleArray(questions);
  answers={};marks=new Set();idx=0;submitted=false;seconds=mins*60;initialSeconds=seconds;
  $('#start').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');$('#timer').classList.remove('hidden');
  $('#examName').textContent=`Đề ${selectedExam+1} · 40 câu`; buildNav(); render(); tick(); clearInterval(ticker);ticker=setInterval(()=>{seconds--;tick();if(seconds<=0){clearInterval(ticker);finish(true)}},1000);
}
function tick(){const m=Math.floor(Math.max(0,seconds)/60),s=Math.max(0,seconds)%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; if(seconds<=300) $('#timer').style.color='var(--bad)'}
function buildNav(){const g=$('#qgrid');g.innerHTML='';questions.forEach((q,i)=>{const b=document.createElement('button');b.className='qnav';b.textContent=i+1;b.onclick=()=>{idx=i;render()};g.appendChild(b)})}
function render(){const q=questions[idx];$('#question').textContent=`Câu ${idx+1}. ${q.question}`;const box=$('#options');box.innerHTML='';q.options.forEach(o=>{const b=document.createElement('button');b.className='opt'+(answers[idx]===o.label?' selected':'');b.innerHTML=`<span class="badge">${o.label}</span><span>${escapeHtml(o.text)}</span>`;b.onclick=()=>{answers[idx]=o.label;render();updateProgress()};box.appendChild(b)});$('#prev').disabled=idx===0;$('#next').textContent=idx===questions.length-1?'Xem lại →':'Câu tiếp →';$('#markBtn').textContent=marks.has(idx)?'★ Đã đánh dấu':'☆ Đánh dấu';updateProgress();$$('.qnav').forEach((b,i)=>b.classList.toggle('current',i===idx))}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('#prev').onclick=()=>{if(idx>0){idx--;render()}};$('#next').onclick=()=>{if(idx<questions.length-1){idx++;render()}else{document.querySelector('.side').scrollIntoView({behavior:'smooth'})}};
$('#markBtn').onclick=()=>{marks.has(idx)?marks.delete(idx):marks.add(idx);render()};
function updateProgress(){const n=Object.keys(answers).length,p=Math.round(n/questions.length*100);$('#answeredTxt').textContent=`${n}/${questions.length} đã làm`;$('#pctTxt').textContent=`${p}%`;$('#bar').style.width=p+'%';$$('.qnav').forEach((b,i)=>{b.classList.toggle('answered',answers[i]!=null);b.classList.toggle('review',marks.has(i))})}
$('#submit').onclick=()=>{const left=questions.length-Object.keys(answers).length; if(left && !confirm(`Bạn còn ${left} câu chưa trả lời. Vẫn nộp bài?`)) return; finish(false)};
function finish(auto){if(submitted)return;submitted=true;clearInterval(ticker);let correct=0;questions.forEach((q,i)=>{if(answers[i]===q.answer)correct++});const wrong=questions.length-correct;const pct=Math.round(correct/questions.length*100);$('#quiz').classList.add('hidden');$('#timer').classList.add('hidden');$('#result').classList.remove('hidden');$('#resultExam').textContent=`Đề ${selectedExam+1}${auto?' · Hết giờ, hệ thống tự nộp bài':''}`;$('#score').textContent=`${correct}/${questions.length}`;$('#correctN').textContent=correct;$('#wrongN').textContent=wrong;const used=initialSeconds-seconds;$('#timeUsed').textContent=`${Math.floor(used/60)}:${String(used%60).padStart(2,'0')}`;$('#grade').textContent=`${pct}% · ${pct>=80?'Kết quả tốt':pct>=60?'Đạt mức khá':'Cần ôn thêm'}`;renderReview();window.scrollTo({top:0,behavior:'smooth'})}
function renderReview(){const r=$('#review');r.innerHTML='<h3>Đối chiếu đáp án</h3>';questions.forEach((q,i)=>{const ok=answers[i]===q.answer;const chosen=q.options.find(o=>o.label===answers[i]);const right=q.options.find(o=>o.label===q.answer);const d=document.createElement('div');d.className='review-item '+(ok?'ok':'bad');d.innerHTML=`<b>Câu ${i+1}. ${escapeHtml(q.question)}</b><p>${ok?'✓ Đúng':'✗ Sai'} · Bạn chọn: ${chosen?answers[i]+'. '+escapeHtml(chosen.text):'Chưa trả lời'}</p><p>Đáp án tài liệu: <b>${q.answer}. ${escapeHtml(right?.text||'')}</b></p>`;r.appendChild(d)})}
$('#retry').onclick=()=>{startQuiz()};$('#home').onclick=()=>{clearInterval(ticker);$('#result').classList.add('hidden');$('#start').classList.remove('hidden');$('#timer').classList.add('hidden')};
</script>
</body></html>
